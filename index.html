<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山禾木序 · 买手店</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Songti SC", "STSong", "SimSun", serif;
    background: #FDFEF8;
    color: #2e3320;
    line-height: 1.8;
    text-align: center;
  }
  header {
    background: #5C6634;
    color: #FDFEF8;
    padding: 64px 20px 48px;
  }
  header h1 {
    font-size: 3rem;
    letter-spacing: 0.35em;
    text-indent: 0.35em;
    font-weight: 600;
  }
  header p {
    margin-top: 16px;
    font-size: 1.15rem;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    opacity: 0.92;
  }
  header .tag {
    display: inline-block;
    margin-top: 24px;
    border: 1px solid rgba(253,254,248,0.7);
    padding: 4px 20px;
    letter-spacing: 0.5em;
    text-indent: 0.5em;
    font-size: 0.95rem;
  }
  main { max-width: 720px; margin: 0 auto; padding: 48px 20px 64px; }
  .offers { margin-bottom: 40px; }
  .offers h2 {
    font-size: 1.2rem;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    color: #5C6634;
    margin-bottom: 20px;
  }
  .offer {
    background: #fff;
    border: 1px solid #e3e6d3;
    border-radius: 8px;
    padding: 20px;
    margin: 12px 0;
    font-size: 1.05rem;
  }
  .poster img {
    width: 100%;
    max-width: 540px;
    border-radius: 8px;
    display: block;
    margin: 0 auto;
  }
  footer {
    padding: 32px 20px 48px;
    color: #6b7050;
    font-size: 0.95rem;
  }
  footer .addr { margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>山禾木序</h1>
  <p>山有其时 · 衣有其序</p>
  <div class="tag">买手店</div>
</header>
<main>
  <section class="offers">
    <h2>开业优惠</h2>
    <div class="offer">不同品类 6–8 折 · 明码实价</div>
    <div class="offer">单笔满 500 元，赠经典精美礼品一份</div>
  </section>
  <section class="poster">
    <img src="poster.png" alt="山禾木序开业海报">
  </section>
</main>
<footer>
  <div>山禾木序买手店</div>
  <div class="addr">五洲东方墅商业街 7栋6号（麦当劳旁）<br>珠海市斗门区珠峰大道</div>
</footer>
</body>
</html>
